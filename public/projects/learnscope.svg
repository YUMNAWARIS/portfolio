  <!-- wordmark -->
  <text x="400" y="272" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="800" fill="#ffffff">LearnScope</text>
  <text x="402" y="318" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" letter-spacing="4" fill="#ffffff" fill-opacity="0.85">AI ACADEMIC ASSISTANT</text>
</svg>
